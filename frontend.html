<!DOCTYPE html>
<html>
<head>
    <title>TDU Nucleus Suite</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 400px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        select, input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            font-size: 16px;
        }
        #output {
            margin-top: 20px;
            padding: 10px;
            background: #eee;
            border-radius: 5px;
            min-height: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>TDU Nucleus Suite</h2>

        <label>Choose Assistant:</label>
        <select id="assistant">
            <option value="geometry">Geometry</option>
            <option value="pattern">Pattern</option>
            <option value="resonance">Resonance</option>
            <option value="translation">Translation</option>
            <option value="domain">Domain</option>
        </select>

        <label>Signal:</label>
        <input type="text" id="signal" placeholder="Enter signal">

        <button onclick="routeSignal()">Route</button>

        <div id="output"></div>
    </div>

    <script>
        function routeSignal() {
            const assistant = document.getElementById("assistant").value;
            const signal = document.getElementById("signal").value;

            // Placeholder output (frontend only)
            document.getElementById("output").innerText =
                "Routing '" + signal + "' to " + assistant + " assistant.";
        }
    </script>
</body>
</html>
